name: Android release APK

on:
  workflow_dispatch:
  push:
    branches: [main, codex/floating-voice-assistant]
  pull_request:
    branches: [main]

concurrency:
  group: android-release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - name: Native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Check packaged permissions
        shell: bash
        run: |
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$apkanalyzer" manifest permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -E 'SYSTEM_ALERT_WINDOW|FOREGROUND_SERVICE_SPECIAL_USE|POST_NOTIFICATIONS' permissions.txt; then
            echo 'Unexpected overlay or foreground permission'
            exit 1
          fi
          "$apkanalyzer" manifest print build/app/outputs/flutter-apk/app-release.apk > manifest.xml
          if grep -E 'TypeFixInputMethodService|FloatingAssistantService' manifest.xml; then
            echo 'Unexpected keyboard or foreground service'
            exit 1
          fi
          grep -q 'FloatingVoiceService' manifest.xml
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' manifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: TypeFix-AI-1.2.0-floating-voice-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            permissions.txt
          if-no-files-found: error
          retention-days: 14
